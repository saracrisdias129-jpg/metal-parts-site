<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Administrativo | Metal Parts</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <div class="login-logo">
                METAL PARTS
            </div>

            <p class="login-subtitulo">
                Painel Administrativo
            </p>

            <h1>
                Entrar
            </h1>

            <p class="login-descricao">
                Acesse a área administrativa da Metal Parts.
            </p>


            <form id="formLogin">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="login-opcoes">

                    <label class="mostrar-senha">

                        <input
                            type="checkbox"
                            id="mostrarSenha"
                        >

                        <span>
                            Mostrar senha
                        </span>

                    </label>


                    <button
                        type="button"
                        id="botaoEsqueciSenha"
                        class="botao-link"
                    >
                        Esqueci minha senha
                    </button>

                </div>


                <button
                    type="submit"
                    id="botaoLogin"
                    class="botao-login"
                >
                    Entrar
                </button>


                <p
                    id="mensagemLogin"
                    class="mensagem-login"
                    aria-live="polite"
                ></p>

            </form>


            <a
                href="../index.html"
                class="login-voltar"
            >
                ← Voltar para o site
            </a>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase/config.js"></script>

    <script src="admin.js"></script>

</body>

</html>
